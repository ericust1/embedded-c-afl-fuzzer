version: "3.8"

services:
  fuzzer:
    image: aflplusplus/aflplusplus:latest
    container_name: afl-fuzzer
    volumes:
      - ../../src/modules/fuzz_targets:/workspace/targets
      - ../../crashes:/workspace/crashes
      - ../../reports:/workspace/reports
    working_dir: /workspace
    networks:
      - fuzz-lab
    stdin_open: true
    tty: true
    command: ["bash"]

  analysis:
    image: ubuntu:22.04
    container_name: crash-analysis
    volumes:
      - ../../crashes:/workspace/crashes
      - ../../reports:/workspace/reports
      - ../../src:/workspace/src
    working_dir: /workspace
    networks:
      - fuzz-lab
    stdin_open: true
    tty: true
    command: ["bash", "-c", "apt-get update && apt-get install -y gdb python3 python3-pip && pip3 install pytest psutil && bash"]

networks:
  fuzz-lab:
    driver: bridge
