name: AFL Fuzzer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gdb python3-pip
          pip install pytest psutil

      - name: Compile fuzz targets with ASan
        run: |
          cd src/modules/fuzz_targets
          make clean
          make all CC=gcc CFLAGS="-O2 -g -fsanitize=address"

      - name: Run Python tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify crash triage scripts
        run: |
          python -m src.core.crash_triage --help
          python -m src.core.root_cause_analyzer --help
          python -m src.core.fuzz_harness --help

  afl-instrumentation-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install AFL++
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev automake cmake git flex bison libglib2.0-dev libpixman-1-dev python3-setuptools cargo libgtk-3-dev
          git clone https://github.com/AFLplusplus/AFLplusplus.git /tmp/afl++
          cd /tmp/afl++
          make distrib
          sudo make install

      - name: Compile with afl-gcc
        run: |
          cd src/modules/fuzz_targets
          make clean
          make afl

      - name: Verify AFL binaries exist
        run: |
          ls -la src/modules/fuzz_targets/bin/
          file src/modules/fuzz_targets/bin/buffer_overflow | grep -q "ELF"
